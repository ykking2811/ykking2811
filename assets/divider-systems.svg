<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 44" width="1200" height="44" role="img" aria-hidden="true">
  <defs>
    <style>
      .bus-packet {
        animation: travel 5s ease-in-out infinite;
      }
      @keyframes travel {
        0% { transform: translateX(0px); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translateX(920px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .bus-packet { animation: none !important; opacity: 0.9; transform: translateX(460px); }
      }
    </style>
  </defs>
  <rect width="1200" height="44" fill="#09090B"/>
  <line x1="20" y1="22" x2="1180" y2="22" stroke="#27272A" stroke-width="1.2"/>
  <rect x="20" y="19" width="120" height="6" rx="3" fill="#991B1B"/>
  <rect x="1060" y="19" width="120" height="6" rx="3" fill="#450A0A"/>
  <circle cx="140" cy="22" r="3.5" fill="#DC2626"/>
  <circle cx="1060" cy="22" r="3.5" fill="#A1A1AA"/>
  <rect x="140" y="20" width="36" height="4" rx="2" fill="#DC2626" class="bus-packet"/>
</svg>
